name: CI
on: [push, pull_request]

jobs:
  test:
    name: Dub Test
    strategy:
      matrix:
        os:
          - ubuntu-24.04
        dc:
          - dmd-2.112.0

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Install LLVM 21
        if: matrix.os == 'ubuntu-24.04'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y llvm-21-dev
          llvm_libdir="$(llvm-config-21 --libdir)"
          echo "LLVM_CONFIG=llvm-config-21" >> "$GITHUB_ENV"
          echo "DFLAGS=-L-L$llvm_libdir${DFLAGS:+ $DFLAGS}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$llvm_libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Run tests
        if: matrix.os != 'ubuntu-24.04'
        run: dub test -q -- -s

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-24.04'
        run: dub run -q -b unittest-cov -c unittest-cov -- -s

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./source-*.lst
          disable_search: true
          fail_ci_if_error: false

      - name: Build binary
        run: dub build -q

      - name: Run benchmark (smoke test)
        run: benchmarks/run.sh --warmup=1 --iterations=3
