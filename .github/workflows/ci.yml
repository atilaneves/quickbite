name: CI
on: [push, pull_request]

jobs:
  test:
    name: Dub Test
    strategy:
      matrix:
        os:
          - ubuntu-24.04
        dc:
          - dmd-2.112.0

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Install LLVM
        if: matrix.os == 'ubuntu-24.04'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: 21.1.8
          directory: ${{ runner.temp }}/llvm

      - name: Configure LLVM library paths
        if: matrix.os == 'ubuntu-24.04'
        run: |
          llvm_libdir="$("$LLVM_PATH/bin/llvm-config" --libdir)"
          llvm_libname="$("$LLVM_PATH/bin/llvm-config" --link-shared --libnames | awk '{ print $1 }')"
          if [[ "$llvm_libname" != libLLVM.so ]]; then
            ln -sf "$llvm_libname" "$llvm_libdir/libLLVM.so"
          fi
          echo "DFLAGS=-L-L$llvm_libdir${DFLAGS:+ $DFLAGS}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$llvm_libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Run tests
        if: matrix.os != 'ubuntu-24.04'
        run: dub test -q -- -s

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-24.04'
        run: dub run -q -b unittest-cov -c unittest-cov -- -s

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./source-*.lst
          disable_search: true
          fail_ci_if_error: false

      - name: Build binary
        run: dub build -q

      - name: Run benchmark (smoke test)
        run: benchmarks/run.sh --warmup=1 --iterations=3
